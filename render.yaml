{
  "previews": { "generation": "off" },
  "services": [
    {
      "type": "web",
      "name": "niro-api",
      "runtime": "node",
      "region": "singapore",
      "autoDeployTrigger": "off",
      "numInstances": 1,
      "healthCheckPath": "/readyz",
      "maxShutdownDelaySeconds": 30,
      "buildCommand": "npm install --global npm@11.6.1 && npm ci --include=dev && npm run deploy:build:server-native && npm run deploy:native:verify -- --scope=server && npm prune --omit=dev --no-audit --no-fund",
      "startCommand": "RELEASE_ID=$RENDER_GIT_COMMIT NEXT_PUBLIC_RELEASE_ID=$RENDER_GIT_COMMIT npm run deploy:start:server-native",
      "envVars": [
        { "key": "NODE_VERSION", "value": "24.x" },
        { "key": "SKIP_INSTALL_DEPS", "value": "true" },
        { "key": "NODE_ENV", "value": "production" },
        { "key": "HOST", "value": "0.0.0.0" },
        { "key": "DEPLOYMENT_ENVIRONMENT", "sync": false },
        { "key": "TRUST_PROXY_HOPS", "sync": false },
        { "key": "MONGODB_URI", "sync": false },
        { "key": "MONGODB_DB_NAME", "sync": false },
        { "key": "MONGODB_SERVER_SELECTION_TIMEOUT_MS", "value": "10000" },
        { "key": "MONGODB_MAX_POOL_SIZE", "value": "10" },
        { "key": "ASSESSMENT_RETENTION_DAYS", "sync": false },
        { "key": "AUTH_ACCESS_SECRET", "generateValue": true },
        { "key": "AUTH_REFRESH_SECRET", "generateValue": true },
        { "key": "ANALYTICS_HASH_SECRET", "generateValue": true },
        { "key": "ANALYTICS_IDENTITY_KEY_VERSION", "value": "v1" },
        { "key": "ANALYTICS_EVENTS_RETENTION_DAYS", "sync": false },
        { "key": "ANALYTICS_REPORTING_TIMEZONE", "value": "Asia/Kolkata" },
        { "key": "ANALYTICS_JOB_LEASE_SECONDS", "value": "900" },
        { "key": "ANALYTICS_MIN_COHORT_SIZE", "value": "5" },
        { "key": "ANALYTICS_VISITOR_PERSISTENCE_ENABLED", "value": "false" },
        { "key": "LEAD_RETENTION_DAYS", "sync": false },
        { "key": "LEAD_CONSENT_VERSION", "sync": false },
        { "key": "CORS_ORIGINS", "sync": false },
        { "key": "API_BASE_URL", "sync": false },
        { "key": "NEXT_PUBLIC_API_BASE_URL", "sync": false },
        { "key": "SITE_URL", "sync": false },
        { "key": "NEXT_PUBLIC_SITE_URL", "sync": false },
        { "key": "NEXT_PUBLIC_ANALYTICS_ENABLED", "value": "false" },
        { "key": "NEXT_PUBLIC_ANALYTICS_REPORTING_TIMEZONE", "value": "Asia/Kolkata" },
        { "key": "NEXT_PUBLIC_ANALYTICS_VISITOR_PERSISTENCE_ENABLED", "value": "false" },
        { "key": "NEXT_PUBLIC_LEAD_CAPTURE_ENABLED", "value": "false" },
        { "key": "LOG_LEVEL", "value": "info" },
        { "key": "METRICS_SCRAPE_TOKEN", "generateValue": true },
        { "key": "CACHE_INVALIDATION_ENDPOINT", "sync": false },
        { "key": "CACHE_INVALIDATION_SIGNING_SECRET", "generateValue": true },
        { "key": "CACHE_INVALIDATION_LEASE_SECONDS", "value": "60" },
        { "key": "CACHE_INVALIDATION_BATCH_SIZE", "value": "25" }
      ]
    },
    {
      "type": "web",
      "name": "niro-web",
      "runtime": "node",
      "region": "singapore",
      "autoDeployTrigger": "off",
      "numInstances": 1,
      "healthCheckPath": "/api/healthz",
      "maxShutdownDelaySeconds": 30,
      "buildCommand": "npm install --global npm@11.6.1 && npm ci --include=dev && NEXT_PUBLIC_RELEASE_ID=$RENDER_GIT_COMMIT npm run deploy:build:client-native && npm run deploy:native:verify -- --scope=client && npm prune --omit=dev --no-audit --no-fund",
      "startCommand": "RELEASE_ID=$RENDER_GIT_COMMIT NEXT_PUBLIC_RELEASE_ID=$RENDER_GIT_COMMIT npm run deploy:start:client-native",
      "envVars": [
        { "key": "NODE_VERSION", "value": "24.x" },
        { "key": "SKIP_INSTALL_DEPS", "value": "true" },
        { "key": "NODE_ENV", "value": "production" },
        { "key": "HOSTNAME", "value": "0.0.0.0" },
        {
          "key": "API_BASE_URL",
          "fromService": { "type": "web", "name": "niro-api", "envVarKey": "API_BASE_URL" }
        },
        {
          "key": "NEXT_PUBLIC_API_BASE_URL",
          "fromService": {
            "type": "web",
            "name": "niro-api",
            "envVarKey": "NEXT_PUBLIC_API_BASE_URL"
          }
        },
        {
          "key": "SITE_URL",
          "fromService": { "type": "web", "name": "niro-api", "envVarKey": "SITE_URL" }
        },
        {
          "key": "NEXT_PUBLIC_SITE_URL",
          "fromService": { "type": "web", "name": "niro-api", "envVarKey": "NEXT_PUBLIC_SITE_URL" }
        },
        {
          "key": "NEXT_PUBLIC_ANALYTICS_ENABLED",
          "fromService": {
            "type": "web",
            "name": "niro-api",
            "envVarKey": "NEXT_PUBLIC_ANALYTICS_ENABLED"
          }
        },
        {
          "key": "NEXT_PUBLIC_ANALYTICS_REPORTING_TIMEZONE",
          "fromService": {
            "type": "web",
            "name": "niro-api",
            "envVarKey": "NEXT_PUBLIC_ANALYTICS_REPORTING_TIMEZONE"
          }
        },
        {
          "key": "NEXT_PUBLIC_ANALYTICS_VISITOR_PERSISTENCE_ENABLED",
          "fromService": {
            "type": "web",
            "name": "niro-api",
            "envVarKey": "NEXT_PUBLIC_ANALYTICS_VISITOR_PERSISTENCE_ENABLED"
          }
        },
        {
          "key": "NEXT_PUBLIC_LEAD_CAPTURE_ENABLED",
          "fromService": {
            "type": "web",
            "name": "niro-api",
            "envVarKey": "NEXT_PUBLIC_LEAD_CAPTURE_ENABLED"
          }
        },
        {
          "key": "CACHE_INVALIDATION_SIGNING_SECRET",
          "fromService": {
            "type": "web",
            "name": "niro-api",
            "envVarKey": "CACHE_INVALIDATION_SIGNING_SECRET"
          }
        }
      ]
    },
