# Reference template only. Replace immutable image digests and create the named
# ConfigMap/Secret through the selected deployment platform before applying.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: niro-server
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: niro-server
  template:
    metadata:
      labels:
        app: niro-server
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
        - name: server
          image: REPLACE_WITH_IMMUTABLE_SERVER_IMAGE_DIGEST
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4000
          envFrom:
            - configMapRef:
                name: niro-server-config
            - secretRef:
                name: niro-server-secrets
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: '1'
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ['ALL']
          volumeMounts:
            - name: runtime-tmp
              mountPath: /tmp
      volumes:
        - name: runtime-tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: niro-server
spec:
  selector:
    app: niro-server
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: niro-client
spec:
  # Keep one replica until the selected Next host/cache adapter proves shared
  # ISR state or complete signed-invalidation fan-out across every replica.
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: niro-client
  template:
    metadata:
      labels:
        app: niro-client
    spec:
      securityContext:
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
        - name: client
          image: REPLACE_WITH_IMMUTABLE_CLIENT_IMAGE_DIGEST
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: niro-client-config
            - secretRef:
                name: niro-client-secrets
          startupProbe:
            httpGet:
              path: /api/healthz
              port: http
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: '1'
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ['ALL']
          volumeMounts:
            - name: next-cache
              mountPath: /app/apps/client/.next/cache
            - name: runtime-tmp
              mountPath: /tmp
      volumes:
        - name: next-cache
          emptyDir: {}
        - name: runtime-tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: niro-client
spec:
  selector:
    app: niro-client
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: niro-server
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: niro-server
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: niro-client
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: niro-client
