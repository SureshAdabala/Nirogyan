version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
      timezone: Asia/Kolkata
    open-pull-requests-limit: 10
    versioning-strategy: increase-if-necessary
    groups:
      npm-production-minor-and-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
      npm-development-minor-and-patch:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:30'
      timezone: Asia/Kolkata
    open-pull-requests-limit: 10
    groups:
      github-actions:
        patterns:
          - '*'
